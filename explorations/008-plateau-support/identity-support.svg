="5"/><rect x="1269.0" y="142" width="34" height="16" rx="3" fill="#dac39a" stroke="#916c36"/><text x="1282.0" y="155" class="small">x</text><path d="M1342.0,178 V158" stroke="#8c9990" stroke-width="5"/><rect x="1325.0" y="142" width="34" height="16" rx="3" fill="#dac39a" stroke="#916c36"/><text x="1338.0" y="155" class="small">y</text><path d="M1173,315 V270" stroke="#8c9990" stroke-width="8"/><rect x="1149" y="248" width="48" height="22" rx="5" fill="#9cbbc3" stroke="#557e8c"/><text x="1169" y="264">0</text><text x="1102" y="466" class="small">Zero rises on its own support.</text><text x="1102" y="489" class="small">Mast / carriage stays connected.</text><text x="28" y="544" class="small">Mechanical hypothesis, side elevation. Grey = external supports; coloured decks = term nodes. Temporary states are not extra algebraic identities.</text></svg>