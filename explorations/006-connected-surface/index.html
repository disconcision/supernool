<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>006 · Connected surfaces</title><link rel="stylesheet" href="style.css"></head><body><aside><a href="../index.html">← nool / Grow catalogue</a><p>006 / LIVE 3D</p><h1>At the junction.</h1><p>A shared surface around a changing tree. Drag the view to inspect the joint.</p><label>Rewrite<select id="rule"><option value="identity">Identity · anchored emergence</option><option value="regroup">Associativity</option><option value="swap">Commutativity</option></select></label><label>Representation<select id="form"><option value="skin">Connected skin</option><option value="skeleton">Skeleton only</option><option value="plates">Plateau study</option></select></label><label>Operand complexity<select id="complexity"><option value="nested">A = x + y</option><option value="simple">Atomic</option><option value="uneven">Uneven branches</option></select></label><label>Identity anchor<select id="anchor"><option value="fixed">Keep attachment · A moves outward</option><option value="moving">Keep A · new context pulls down</option></select></label><label>Plus correspondence<select id="mapping"><option value="keep">Keep root p</option><option value="exchange">Exchange p / q roles</option></select></label><label>Swap path<select id="path"><option value="orbit">Orbit in depth</option><option value="flat">Flat crossing</option></select></label><label>Camera<select id="camera"><option value="iso">Orthographic</option><option value="perspective">Perspective</option></select></label><label class="check"><input type="checkbox" id="runes" checked>Show node runes</label><label class="check"><input type="checkbox" id="wire">Wireframe</label><label>Junction softness<input id="blend" type="range" min="0.08" max="0.6" step="0.02" value="0.24"></label><p id="note"></p><a href="README.md">Model and limitations</a></aside><main><div id="canvas"></div><div class="transport">
