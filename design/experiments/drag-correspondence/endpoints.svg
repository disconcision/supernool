<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490"><rect width="1080" height="490" fill="#f4f1e8"/><g font-family="system-ui,sans-serif" fill="#354139"><text x="30" y="35" font-size="23">A thirteen-node witness: (3T + (−3)T) + z, with T = x + y</text><text x="30" y="63" font-size="14">Controlled planar layout, depth heights, no irregularity. Positions below are drawn to the same scale.</text><path d="M540 85V425" stroke="#ccd1c7"/><text x="30" y="108" font-size="19">Current guide targets</text><text x="575" y="108" font-size="19">Where the assigned objects end up</text>
<g stroke-width="3" fill="none"><path d="M440 165L350 345" stroke="#8963a6"/><path d="M440 165L341 345" stroke="#99714c" stroke-dasharray="6 5"/><path d="M1000 165L910 345" stroke="#8963a6"/><path d="M1000 165L757 165" stroke="#397f88"/></g><g fill="#506950"><circle cx="440" cy="165" r="8"/><circle cx="1000" cy="165" r="8"/></g><text x="363" y="145" font-size="15">grab second T</text><text x="917" y="145" font-size="15">same grab</text><circle cx="350" cy="345" r="7" fill="#8963a6"/><circle cx="341" cy="345" r="7" fill="#99714c"/><circle cx="910" cy="345" r="7" fill="#8963a6"/><circle cx="757" cy="165" r="7" fill="#397f88"/><text x="40" y="330" font-size="16" fill="#8963a6">Factor</text><text x="40" y="356" font-size="16" fill="#99714c">Distribute</text><text x="40" y="390" font-size="14">0.075 layout units apart · 2.25° between pulls</text><text x="578" y="200" font-size="15" fill="#397f88">Distribution: held ID’s actual final position</text><text x="578" y="225" font-size="14">Its label changes from + to × in current code.</text><text x="578" y="362" font-size="15" fill="#8963a6">Factoring: surviving twin’s final position</text><text x="578" y="390" font-size="14">The held copy is currently deleted, unlike Nool’s prefer-grab policy.</text><text x="30" y="458" font-size="16">This is an audit of the existing mapping—not a proposed gesture. Fix correspondence before optimizing separation.</text></g></svg>
